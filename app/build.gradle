plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tutor.cecyt3'
    compileSdk 34

    defaultConfig {
        applicationId "com.tutor.cecyt3"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Chaquopy necesita saber qué arquitecturas de CPU soportar.
        // Mantenemos arm64-v8a (tu Z Flip 6 y el Oppo A40) y x86_64 (emulador).
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            // Alineado con la versión de Python de tu laptop
            version "3.14"

            // LA RUTA MAESTRA: Redirige a Gradle al ejecutable real, ignorando a Microsoft Store
            buildPython "C:/Users/Angy2/AppData/Local/Python/bin/python.exe"

            // Paquetes de Python puro que usan tus motores expertos
            pip {
                install "sympy"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Le decimos a Android Studio dónde vive tu código Python (Quasar Engine)
    sourceSets {
        main {
            python {
                srcDirs = ["src/main/python"]
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation("pl.droidsonroids.gif:android-gif-drawable:1.2.28")
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}